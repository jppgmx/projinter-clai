services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clai}
      POSTGRES_USER: ${POSTGRES_USER:-clai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clai_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-clai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-clai_dev}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    volumes:
      - ./apps/backend:/workspace
      - ./docker-data/maven-cache:/root/.m2
    command: ["sh", "mvnw", "spring-boot:run"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
