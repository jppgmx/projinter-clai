spring.application.name=backend
server.port=${SERVER_PORT:4040}
spring.config.import=optional:file:./apps/backend/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clai_dev}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
