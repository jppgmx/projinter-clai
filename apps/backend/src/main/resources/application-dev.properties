server.port=${SERVER_PORT:4040}
# Credenciais particulares são importadas somente no desenvolvimento.
spring.config.import=optional:file:./apps/backend/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
