name: clai-prod

services:
  backend:
    build:
      context: ./apps
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Defina a URL JDBC do Supabase em .env.prod}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Defina o usuario do Supabase em .env.prod}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina a senha do Supabase em .env.prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
