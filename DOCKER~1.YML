name: clai-dev

services:
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/backend:/workspace
      - ./apps/frontend:/frontend:ro
      - ./docker-data/maven-cache:/root/.m2
    command: ["sh", "mvnw", "spring-boot:run"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
